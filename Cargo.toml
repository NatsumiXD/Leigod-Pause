[package]
name = "leigod-pause"
version = "0.1.0"
edition = "2024"
description = "Leigod-Pause: portable terminal LeiGod launcher with pause-on-exit control"

[[bin]]
name = "leigod-status"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
