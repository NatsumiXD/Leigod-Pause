name: Build Windows portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_VERSION: '1.99.0'
  NODE_VERSION: '24.18.0'
  BUILD_TARGET: x86_64-pc-windows-msvc

jobs:
  portable:
    name: Windows x64 portable
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: npm
          cache-dependency-path: ci/runtime/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt --component clippy --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust
        run: cargo test --locked --target $env:BUILD_TARGET --target-dir target/ci

      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets --target $env:BUILD_TARGET --target-dir target/ci -- -D warnings

      - name: Test JavaScript observers
        run: node --test tests/*.test.cjs

      - name: Install locked Frida runtime
        run: npm ci --prefix ci/runtime --omit=dev --no-audit --no-fund

      - name: Build release executable
        run: cargo build --locked --release --target $env:BUILD_TARGET --target-dir target/ci

      - name: Assemble and verify portable ZIP
        run: |
          ./scripts/create-portable.ps1 `
            -Executable "target/ci/$env:BUILD_TARGET/release/leigod-status.exe" `
            -NodeExecutable (Get-Command node.exe).Source `
            -FridaDirectory ci/runtime/node_modules/frida `
            -OutputDirectory dist/ci

      - name: Upload portable package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LeiGodLauncher-windows-x64-${{ github.run_number }}
          path: |
            dist/ci/LeiGodLauncher-portable-windows-x64.zip
            dist/ci/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  prerelease:
    name: Publish GitHub prerelease
    needs: portable
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified portable package
        uses: actions/download-artifact@v8.0.2
        with:
          name: LeiGodLauncher-windows-x64-${{ github.run_number }}
          path: release-assets

      - name: Verify downloaded checksum
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Upload and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="pre-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          notes="${RUNNER_TEMP}/prerelease-notes.md"
          cat > "$notes" <<EOF
          Leigod-Pause Windows x64 自动预发布。

          - 提交：${GITHUB_SHA}
          - 构建：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 下载并完整解压 LeiGodLauncher-portable-windows-x64.zip，运行 LeiGodLauncher/leigod-status.exe。
          - 包含私有 Node/Frida，无需另外安装；SHA256SUMS.txt 用于校验 ZIP。
          EOF
          gh release create "$tag" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Leigod-Pause ${tag}" --notes-file "$notes"
          gh release upload "$tag" \
            release-assets/LeiGodLauncher-portable-windows-x64.zip \
            release-assets/SHA256SUMS.txt
          gh release edit "$tag" --draft=false --prerelease --latest=false
          echo "预发布：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
